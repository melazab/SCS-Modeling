# Named SCS lead configurations for RADO-SCS 3.0.
#
# WHAT THIS FILE IS FOR
# ---------------------
# One .FCStd per lead configuration does not scale: the document is 25 MB, so
# ten configurations is 250 MB of near-identical binary and a merge conflict
# waiting to happen. This file plus src/freecad/generated_leads/<name>/ is the
# durable artefact instead. A configuration here is a dozen numbers; the STLs it
# produces are a few hundred kB.
#
# There is now exactly ONE model document, NBF_RADO-SCS.FCStd, and it holds
# ANATOMY ONLY. Leads are configuration plus geometry generated on demand:
# preview them into the open document with src/freecad/lead_designer.FCMacro,
# export the set you want with src/freecad/build_lead_config.py, and close the
# document without saving. The former NBF_RADO-SCS_dorsal.FCStd and
# _ventral.FCStd are gone; `dorsal_z110_8c` and `ventral_z110_8c` below are what
# they contained.
#
# A CONFIGURATION IS A SET OF LEADS
# ---------------------------------
# Clinicians do not implant one lead and stop. Two dorsal leads straddling the
# midline is routine; so is a dorsal lead plus a DRG lead, or a DRG lead on each
# side. So a configuration here is a SET. Write it either way:
#
#     dorsal_z110_8c:              # one lead: describe it inline, as before
#       z_center: 110.4
#
#     dorsal_pair_T11:             # several: a `leads:` list
#       contacts: 8                #   keys out here apply to EVERY lead in the
#       leads:                     #   set, so shared parameters are written once
#         - x_offset:  1.5
#         - x_offset: -1.5
#
# max_leads_per_type below caps how many leads of any ONE type a set may hold.
# A set may hold up to that many of each type, so with the default of 2 the
# largest legal set is two dorsal + two ventral + two DRG.
max_leads_per_type: 2

# THREE LEAD TYPES, AND DRG IS NOT A VARIATION ON THE OTHER TWO
# -------------------------------------------------------------
#   type: dorsal    percutaneous lead in the DORSAL epidural space, running
#   type: ventral   rostro-caudally along the canal. Positioned by z_center (or
#                   a vertebral `level`) and x_offset from the midline, and swept
#                   along the canal centreline measured in epidural_corridor.json.
#
#   type: drg       percutaneous lead in the lateral epidural space and the
#                   NEUROFORAMEN, running LATERALLY out to one dorsal root
#                   ganglion. It does not follow the canal centreline at all --
#                   its long axis is x, and both y and z follow a curve. It is
#                   positioned by naming a ganglion (`target: L3`), and swept
#                   along the foraminal corridor measured in
#                   foraminal_corridors.json by src/freecad/measure_foramen.py.
#
# The parameters are therefore NOT interchangeable, and build_lead_config.py
# rejects rather than ignores a parameter that means nothing for the type:
# `z_center` on a DRG lead, or `target` on a dorsal one, is an error.
#
# THE FRAME (src/freecad/check_laterality.py, src/freecad/epidural_corridor.json)
# ------------------------------------------------------------------------------
#   +X  anatomical LEFT      midline is x = 56.60 mm
#   +Y  posterior / DORSAL
#   +Z  rostral (towards the head)
# Millimetres throughout, in the model's own coordinates -- these are absolute
# positions in NBF_RADO-SCS.FCStd, not offsets from anything the user picks.
#
# x_offset (dorsal/ventral only) is SIGNED and measured from the midline:
#
#       x_offset = +1.0   ->  1 mm to the patient's LEFT   (x = 57.60)
#       x_offset =  0.0   ->  on the midline               (x = 56.60)
#       x_offset = -1.0   ->  1 mm to the patient's RIGHT  (x = 55.60)
#
# The epidural corridor was re-measured at +/-4 mm off the midline and is still a
# single clean channel there (dorsal 2.29-2.32 mm, ventral 1.74-1.76 mm), but
# the channel CENTRE moves as you go lateral -- about 1.1 mm of y at 4 mm off --
# so build_lead_config.py re-measures the centreline at the requested x rather
# than reusing the midline polynomial in epidural_corridor.json. Do not assume a
# lateral variant can be had by shifting a midline lead sideways.
#
# LEAD DIAMETER: 1.25 OR 1.30 mm?
# -------------------------------
# Khadka et al. 2020 specify a 1.25 mm lead (8 contacts, 3 mm long, 1 mm apart).
# The default here is 1.30 mm, which is the common clinical percutaneous
# diameter and what make_scs_lead.py has used since the first lead was built --
# the existing dorsal_z110_8c / ventral_z110_8c STLs are 1.30 mm. Neither number
# is wrong and the difference is 0.05 mm, about 2% of the dorsal channel; both
# clear the fit check on both sides. They are kept apart rather than reconciled:
# `khadka_clinical_T10` reproduces the paper's lead exactly for comparison
# against published results, and everything else uses the 1.30 mm house default.
# If you need to match the paper numerically, use the khadka entry; do not "fix"
# the default, or the existing generated STLs silently stop matching their own
# config.
#
# VERTEBRAL LEVELS -- READ THE CAVEAT
# -----------------------------------
# `levels` below is DERIVED FROM THE GEOMETRY, not invented. RADO names its four
# intervertebral discs for the levels they separate -- T_disk_9_10x, T_disk_10_11x,
# T_disk_11_12x, T_disk_12_Lx -- and their z positions come out in exactly the
# order +Z-is-rostral demands (9/10 highest at z = 152.5, 12/L1 lowest at
# z = 66.3), which is independent evidence that those names mean what they say.
# A vertebral body is then the gap between two consecutive discs, and its centre
# is the level's z. Cross-checked a second way: taking only the anterior mass of
# each vertebra STL (y < 58, i.e. the body, not the posterior arch) gives centres
# of 80.6 / 110.8 / 139.2 against the inter-disc 80.4 / 110.3 / 138.8 -- two
# independent derivations agreeing to 0.6 mm.
#
# THE CAVEAT: those disc names imply the three vertebral bodies here are T10,
# T11 and T12. The paper and CLAUDE.md describe the model as T9-T11, and RADO's
# own filename prefix is "T8-10". All three disagree, and nothing in the geometry
# can settle it -- there is no C2 to count down from. So the level names below
# are RADO's disc names taken at face value, and if you are comparing against a
# clinical target level, check which convention your collaborator means before
# trusting the label. The z coordinates are solid; only the names are in doubt.
#
# Use a level by naming it instead of z_center:
#
#     level: T10          # instead of  z_center: 138.83
#
# z_center is the centre of the contact array (the tails are symmetric, so it is
# also the centre of the whole lead).
#
# GANGLION NAMES -- READ THIS CAVEAT TOO
# --------------------------------------
# A DRG lead names its target ganglion: L1..L4 on the patient's left, R1..R4 on
# the right, counted ROSTRAL to CAUDAL within each side. They are the model's own
# ganglion numbering, taken from the ganglion cores' z, and they are NOT lumbar
# levels -- "L3" means "left, third from the top", which in this T8-T10 model is
# a thoracic ganglion at about z = 93. It is the same numbering the body labels
# use ("DRG L3 -- ganglion core"), derived the same way. The eight and their
# corridors are in src/freecad/foraminal_corridors.json; run
# `freecadcmd src/freecad/measure_foramen.py` to regenerate it.

defaults:
  type: dorsal            # dorsal | ventral | drg
  contacts: 8             # number of cylindrical contacts
  contact_length: 3.0     # mm, along the lead
  gap: 1.0                # mm of insulator between adjacent contacts
  diameter: 1.3           # mm, see the note above about 1.25 vs 1.30
  tail: 6.0               # mm of plain insulator beyond the end contacts

# Applied on top of `defaults` for a dorsal or ventral lead only.
epidural_defaults:
  x_offset: 0.0           # mm from midline, + is anatomical LEFT
  z_center: 110.0         # mm, centre of the contact array

# Applied on top of `defaults` for a DRG lead only. A DRG lead is a different
# piece of hardware, not a dorsal lead pointed sideways: clinical percutaneous
# DRG leads carry four SHORT contacts (about 1.25 mm) on a 4 mm pitch, against
# the eight 3 mm contacts on a 4 mm pitch of a dorsal-column lead. RADO's own
# 4-contact lead measures 1.25 mm contacts on a 4.75 mm pitch, which is what
# `rado_drg_L3_match` below reproduces.
drg_defaults:
  contacts: 4
  contact_length: 1.25
  gap: 2.75               # -> 4.00 mm contact pitch
  # 1.0 mm of plain insulator beyond the end contacts, and no more. The medial
  # end of a DRG lead is heading back towards the canal, and a longer tail walks
  # it into the dural sac -- measured, on every one of the eight foramina, a
  # 2.5 mm tail puts the medial tip inside the thecal sac. (A real lead does of
  # course continue back up the epidural space; this model stops at the foramen,
  # the way RADO's own lead does, because the field near the contacts is what
  # the solve is for.)
  tail: 1.0
  target: L3              # which ganglion: L1..L4 (left) or R1..R4 (right)

  # How far along the corridor the CENTRE of the contact array sits, relative to
  # the ganglion's own centre. + is further out along the root. The default is
  # 2.5 rather than 0 for two measured reasons, not for taste:
  #
  #   - Medial of the ganglion the foraminal block flares vertically to meet the
  #     canal -- on L3 it is 14 mm tall in z at 11 mm out -- and its centre
  #     climbs 3-4 mm above the nerve root, so the corridor is a poor description
  #     of where a lead goes there. RADO's own lead follows the root instead.
  #     +2.5 keeps every contact at 11.5 mm out or more, clear of that flare.
  #   - It is also the clinical placement and RADO's: the array is advanced past
  #     the ganglion so the proximal contacts lie over it and the tip is distal.
  #     RADO's own array centre is 2.93 mm out from the ganglion's.
  #
  # 1.0 rather than something bigger because the foramen is only about 20 mm of
  # usable channel and this lead is 15.25 mm long: pushed further out, the tip
  # leaves the foraminal tissue. Checked on all eight -- with these defaults
  # seven of the eight validate clean. R1, the tightest foramen in the model
  # (5.3 x 6.2 mm at its narrowest), leaves the tissue with about 0.8% of its
  # sampled surface whatever the lateral offset, and needs a y_offset or
  # z_offset nudge of its own; the fit check says so and says where.
  lateral_offset: 1.0

  # How far the lead surface is held off the ganglion, mm. The lead is placed on
  # the corridor centre and then shifted ROSTRALLY by however much it takes to
  # keep this clearance -- the shift is SOLVED FOR, not written down, because it
  # differs by foramen (0.77 mm on L3, 1.62 mm on R3 for 0.25 mm of clearance).
  # See build_lead_config.ganglion_standoff for why rostrally and why at all;
  # the short version is that the corridor centre runs along the top of the
  # ganglion to within 0.1 mm, so without this a lead is a coin toss between
  # touching it and cutting into it. 0.0 means "sit on the corridor centre",
  # which is what RADO's own lead does.
  ganglion_clearance: 0.5

  y_offset: 0.0           # further nudge from the corridor centre, + is DORSAL
  z_offset: 0.0           # further nudge from the corridor centre, + is ROSTRAL

# Vertebral level -> z of the body centre, mm. Derived above; see the caveat.
levels:
  T10: 138.83             # body spans z 129.02 .. 148.63 (19.6 mm)
  T11: 110.26             # body spans z 102.11 .. 118.41 (16.3 mm)
  T12: 80.44              # body spans z  73.45 ..  87.42 (14.0 mm)
  T9-T10_disc: 152.49
  T10-T11_disc: 123.71
  T11-T12_disc: 94.76
  T12-L1_disc: 66.28

configs:

  # -- single dorsal / ventral leads ---------------------------------------

  # Khadka et al. 2020's own arrangement, for reproducing the published model:
  # 8 contacts, 1.25 mm diameter, 3 mm contacts, 1 mm gaps, dorsal, at T10,
  # 1 mm lateral to the dorsal column midline. The paper does not say which
  # side of the midline, so LEFT is used -- it matches the side RADO's own
  # 4-contact DRG lead sits on, and the model is close to symmetric here.
  khadka_clinical_T10:
    diameter: 1.25
    level: T10
    x_offset: 1.0
    note: "Khadka et al. 2020 J Neural Eng 17:026033, section 2.1 and figure 1."

  # The dorsal-vs-ventral study's two arms. These were the contents of the
  # former NBF_RADO-SCS_dorsal.FCStd and _ventral.FCStd; those documents are
  # gone and these entries plus generated_leads/<name>/ replace them.
  #
  # z_center is 110.43203353881836 and NOT the round 110.0 the directory name
  # suggests. Those STLs were built before this file existed, by make_scs_lead.py
  # with no --z-center at all, and its default is the midpoint of the measured
  # corridor: 0.5 * (61.43203353881836 + 159.43203353881836). The "z110" in the
  # tag is that number through "%.0f". Spelled out to every digit deliberately --
  # with 110.0 here the configuration rebuilds the lead 0.43 mm caudal of the
  # committed STLs, which is the exact silent divergence this catalogue exists
  # to prevent. Verified: exporting this entry reproduces all nine committed
  # STLs byte for byte.
  #
  # It also lands 0.17 mm rostral of the derived T11 body centre, which is
  # coincidence rather than intent.
  dorsal_z110_8c:
    z_center: 110.43203353881836
    note: "House default. Verified 100% of vertices in epidural fat, 0% in dura."

  ventral_z110_8c:
    type: ventral
    z_center: 110.43203353881836
    note: "Ventral counterpart of dorsal_z110_8c, for the dorsal-vs-ventral study."

  # Lateral offsets. The dorsal columns are the target of SCS, so a 1-2 mm
  # lateral lead is the standard way to ask "how much does laterality cost?" --
  # both of these are re-measured at their own x, not shifted from midline.
  dorsal_T11_left1:
    level: T11
    x_offset: 1.0
    note: "1 mm to the patient's left of midline, at T11."

  dorsal_T11_right2:
    level: T11
    x_offset: -2.0
    note: "2 mm to the patient's right of midline, at T11."

  # -- multi-lead sets -------------------------------------------------------

  # The standard clinical dorsal arrangement, and the ready-made two-lead entry:
  # a matched pair of 8-contact leads straddling the midline. 1.5 mm each side
  # puts their axes 3.0 mm apart, so with 1.30 mm leads there is 1.70 mm of
  # epidural fat between them -- they do not touch, which the set's collision
  # check measures rather than assumes. Both are re-measured on their own
  # centreline at their own x.
  dorsal_pair_T11:
    level: T11
    note: "Two 8-contact leads straddling the midline at T11, 3.0 mm apart."
    leads:
      - x_offset: 1.5
      - x_offset: -1.5

  # Kept deliberately, the way ventral_z110_2mm_FAILS is: a worked example of a
  # set whose leads are each individually fine and which is still not
  # implantable. 0.5 mm each side puts the two axes 1.0 mm apart while the leads
  # are 1.30 mm across, so they occupy the same 0.3 mm of epidural fat. Nothing
  # in the per-lead fit check can see that -- it is the reason the set-level
  # collision check exists.
  dorsal_pair_tight_FAILS:
    level: T11
    note: "Expected to FAIL the collision check: two 1.30 mm leads 1.0 mm apart."
    leads:
      - x_offset: 0.5
      - x_offset: -0.5

  # -- DRG leads -------------------------------------------------------------

  # The house DRG lead: four 1.25 mm contacts on a 4 mm pitch, threaded out
  # through the left level-3 neuroforamen with the array centred on the
  # ganglion. Swept along the corridor measured by measure_foramen.py, not along
  # the canal centreline.
  drg_L3_4c:
    type: drg
    target: L3
    note: "House DRG default, on the same ganglion RADO's own lead sits on."

  # RADO's own 4-contact lead, as parameters. Measured off the five STLs it
  # ships (SCS Lead Electrode 1-4.stl + SCS Lead Insulator.stl): contact centres
  # 11.16, 15.65, 20.30 and 25.40 mm left of the midline -- a 4.75 mm pitch --
  # each about 1.25 mm long and 1.25 mm across, on an insulator that stops at
  # the end contacts rather than running on, hence tail 0. The array centre is
  # 2.93 mm lateral of the ganglion's own centre, so the ganglion sits under the
  # three MEDIAL contacts and the fourth is distal to it.
  #
  # This is the validation case for the whole DRG trajectory: RADO placed that
  # lead by hand in SolidWorks, and if a lead generated from the measured
  # foraminal corridor lands where RADO's is, the corridor is right. Check it
  # with `--name rado_drg_L3_match --compare-rado`, which measures the agreement
  # contact by contact instead of asserting it.
  rado_drg_L3_match:
    type: drg
    target: L3
    contacts: 4
    contact_length: 1.25
    gap: 3.50
    diameter: 1.25
    tail: 0.0
    lateral_offset: 2.93
    ganglion_clearance: 0.0
    note: "RADO's own DRG lead as parameters -- the trajectory's validation case."

  # Bilateral DRG stimulation at one level, which is a real clinical
  # arrangement: two leads, one per foramen, mirrored about the midline.
  drg_bilateral_3:
    type: drg
    note: "Bilateral DRG leads at the model's third ganglion pair."
    leads:
      - target: L3
      - target: R3

  # A dorsal lead and a DRG lead together -- the arrangement that motivated
  # making a configuration a set in the first place, and the one that most needs
  # the collision check, since the two run through different spaces but their
  # ends approach each other near the lateral recess.
  dorsal_plus_drg_L3:
    note: "8-contact dorsal lead at T11 plus a 4-contact DRG lead on L3."
    leads:
      - type: dorsal
        level: T11
        x_offset: 1.0
      - type: drg
        target: L3

  # -- worked failures -------------------------------------------------------

  # Kept deliberately: a worked example of a configuration that FAILS. The
  # ventral epidural fat is only about 1.7 mm thick, so a 2 mm lead cannot be
  # there without pressing through the dura. build_lead_config.py should report
  # this in those words and refuse to export it, rather than carving anatomy.
  ventral_z110_2mm_FAILS:
    type: ventral
    diameter: 2.0
    z_center: 110.43203353881836
    note: "Expected to FAIL the fit check -- this entry exists to demonstrate it."
