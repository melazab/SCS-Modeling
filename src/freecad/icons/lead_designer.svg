<?xml version="1.0" encoding="UTF-8"?>
<!--
  Toolbar icon for src/freecad/lead_designer.FCMacro: a percutaneous SCS lead.

  It is a MINIATURE, not a model. A faithful 8-contact array is eight 3 mm bands
  on a 4 mm pitch, which at 16 px is about a pixel per band and reads as a grey
  smudge. So this draws FOUR bands on a fat pitch. What has to survive the
  shrink is the alternation (metal, dark, metal, dark), because that is what
  says "electrode array" rather than "wire" or "needle".

  SLIM AND FULL-HEIGHT. An earlier version was 9 units wide in a 32 unit box,
  and at that aspect ratio a banded cylinder reads as a battery. A real
  percutaneous lead is about 1.3 mm across and tens of mm long; leaning into
  that proportion is what makes it read as a lead. The shaft is 6 units wide and
  runs off the bottom edge, ending in a rounded tip near the top, so it reads as
  the business end of something long.

  UPRIGHT, NOT DIAGONAL, for legibility rather than taste: a vertical rod puts
  every band edge on a horizontal pixel boundary, so the stripes stay crisp at
  16 px. Tilted versions of this drawing blur into a grey capsule at that size.

  TWO RENDERER TRAPS, both of which produce a FULLY TRANSPARENT icon with no
  error message at all, so neither is obvious from looking at the output:

    1. No double hyphen anywhere inside an XML comment. It is illegal XML, the
       whole file fails to parse, and QSvgRenderer.isValid() goes False. This
       cost a debugging cycle here.
    2. No clipPath. FreeCAD draws toolbar icons through Qt's QSvgRenderer,
       which implements SVG Tiny and silently drops it.

  So every band below is a plain rect no wider than the shaft, needing no
  clipping. That is also more accurate: real SCS contacts are flush cylinders of
  the same diameter as the lead body, not raised collars.

  Check any edit with:
    python3 -c "import xml.etree.ElementTree as E; E.parse('lead_designer.svg')"

  The colours are the model's own, so the icon and the geometry agree:
     contacts   192,192,192  #c0c0c0   electrode_contact in src/ansys/tissue_map.yaml
     insulator   40, 40, 40  #282828   lead_insulation

  A pure #282828 body would vanish on a dark toolbar theme, so the shaft carries
  a thin mid-grey outline: the silver bands give contrast on white, the outline
  gives contrast on black.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!-- insulator: rounded tip at the top, running off the bottom edge -->
  <path d="M 13,32 L 13,7 A 3,3 0 0 1 19,7 L 19,32 Z" fill="#282828"/>
  <!-- four contacts, flush with the shaft so no clipping is needed -->
  <g fill="#c0c0c0">
    <rect x="13" y="8.5"  width="6" height="3.5"/>
    <rect x="13" y="14.0" width="6" height="3.5"/>
    <rect x="13" y="19.5" width="6" height="3.5"/>
    <rect x="13" y="25.0" width="6" height="3.5"/>
  </g>
  <path d="M 13,32 L 13,7 A 3,3 0 0 1 19,7 L 19,32 Z"
        fill="none" stroke="#6f6f6f" stroke-width="0.7" stroke-linejoin="round"/>
</svg>
