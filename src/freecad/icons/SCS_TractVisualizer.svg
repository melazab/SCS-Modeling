<?xml version="1.0" encoding="UTF-8"?>
<!--
  Toolbar icon for src/freecad/SCS_TractVisualizer.FCMacro: an axial section
  of the cord, divided into tracts.

  The macro's subject is the tract layout inside the white matter, so the icon
  is the cord's oval cut into the three territories the panel groups by,
  in the tract colours the panel and the bodies use
  (src/atlas/register_tracts.py COLOURS):
     dorsal columns (gracilis)   #1f5fbf   bottom middle (posterior, as the
                                            Cross-section viewer shows it)
     lateral corticospinal       #d62728   sides
     spinal lemniscus            #2ca02c   anterolateral, top
  and a grey bar for the grey matter. Three territories rather than fifteen
  for the reason the lead icon draws three contacts: at 16 px more is a smear.
  The dark outline keeps the oval on light and dark toolbars alike.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!-- regions bounded by the oval's own arcs: Qt's SVG renderer (SVG Tiny)
       ignores clipPath, so nothing here relies on clipping -->
  <ellipse cx="16" cy="16" rx="14" ry="10" fill="#2ca02c"/>
  <path d="M 2.07,15 L 29.93,15 A 14,10 0 0 1 2.07,15 Z" fill="#d62728"/>
  <path d="M 10.5,19 L 16,16.5 L 21.5,19 L 21.5,25.2 A 14,10 0 0 1 10.5,25.2 Z" fill="#1f5fbf"/>
  <rect x="7" y="13.2" width="18" height="2.8" fill="#808080"/>
  <ellipse cx="16" cy="16" rx="14" ry="10" fill="none" stroke="#3c3c3c" stroke-width="1.3"/>
</svg>
