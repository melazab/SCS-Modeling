# Filename-pattern -> tissue mapping for the NBF_RADO-SCS STL set (STL_files/).
#
# Purpose: drive Ansys Mechanical name selections (one per tissue class) and
# material assignment. Patterns are case-insensitive substrings/globs matched
# against the STL filename (without extension). First match wins, top to bottom,
# so the more specific patterns come first.
#
# Material values come from Mohamed's Ansys Engineering Data on Pioneer:
#   ~/Documents/SCS-Modeling/ANSYS/SCS_Modeling_files/dp0/SYS/ENGD/EngineeringData.xml
# They are stored there as electrical RESISTIVITY in ohm*m at 37 C; sigma = 1/rho
# is derived here. `ed_material` is the exact Engineering Data material name to
# assign in Mechanical.
#
# `color_rgb` is the 0-255 Appearance colour Mohamed assigned that same material
# in Engineering Data, so a body is the same colour in FreeCAD as in Mechanical.
# src/freecad/apply_colors.py reads these and paints the FreeCAD document.
# CAUTION: the flat `SCS_Modeling_engineering_data_all.xml` export in the parent
# directory reports 109,157,209 for EVERY material -- that is Workbench's default
# appearance, not what is set in the project. Read the dp0/SYS/ENGD file instead.
#
# NOTE: white matter is ISOTROPIC in Engineering Data (0.1432 S/m = the paper's
# transverse value). The paper's anisotropic white matter (0.1432 transverse /
# 0.6 longitudinal S/m) can't be entered in the Mechanical Electric GUI; it needs
# an APDL command snippet (MP,RSVX/RSVY/RSVZ) or PyMAPDL. See
# mapdl_electric_solve_template.dat. Cord axis is global Z in this STL set.

tissues:
  - name: electrode_contact
    ed_material: "Metal Electrode"
    color_rgb: [192, 192, 192]
    patterns: ["SCS Lead Electrode *"]
    rho_ohm_m: 2.5e-7
    sigma_S_per_m: 4.0e6
    note: "Matches every generated lead's contacts as well as RADO's own four --
      the exported filenames are deliberately RADO's. A bipolar test uses two of
      them as +/-1 mA source/sink. Corrected 2026-09-10: this said \"4 contacts\",
      which was true only of RADO's DRG lead; a dorsal study lead has 8 and a
      configuration may now hold several leads."

  - name: lead_insulation
    ed_material: "Lead Insulation"
    color_rgb: [ 40,  40,  40]
    patterns: ["SCS Lead Insulator"]
    rho_ohm_m: 50000
    sigma_S_per_m: 2.0e-5

  - name: vertebra
    ed_material: "Vertebra"
    color_rgb: [230, 220, 195]
    patterns: ["V1-2", "V1-3", "V1-4"]
    rho_ohm_m: 25
    sigma_S_per_m: 0.04

  - name: intervertebral_disc
    ed_material: "Intervertebral Disc"
    color_rgb: [176, 196, 222]
    patterns: ["T_disk_*"]
    rho_ohm_m: 1.6667
    sigma_S_per_m: 0.6

  - name: white_matter
    ed_material: "White Matter"
    color_rgb: [250, 249, 246]
    patterns: ["neuro_whitemater"]
    rho_ohm_m: 6.9832
    sigma_S_per_m: 0.1432
    paper_anisotropic_S_per_m: [0.1432, 0.6]   # transverse, longitudinal (needs APDL)

  - name: grey_matter
    ed_material: "Gray Matter"
    color_rgb: [128, 128, 128]
    patterns: ["neuro_GreyMater"]
    rho_ohm_m: 3.6232
    sigma_S_per_m: 0.276

  - name: csf
    ed_material: "CSF"
    color_rgb: [189, 235, 249]
    patterns: ["neuro_CSF", "*csf_coating*"]
    rho_ohm_m: 0.5882
    sigma_S_per_m: 1.7

  - name: meninges_dura
    ed_material: "Dura Mater"
    color_rgb: [245, 245, 220]
    patterns: ["neuro_Meninges", "additional_menginges*", "*menging_coating*", "*Menging*", "*Menginges*"]
    rho_ohm_m: 27.027
    sigma_S_per_m: 0.037

  - name: epidural_space
    ed_material: "Epidural Space"
    color_rgb: [255, 250, 205]
    patterns: ["neuro_EpiduralSpace"]
    rho_ohm_m: 25
    sigma_S_per_m: 0.04

  - name: blood_vessel
    ed_material: "Vasculature"
    color_rgb: [200,  30,  30]
    patterns:
      - "neuro_blood_in_fat"
      - "neuro_blood_next_to_WM"
      - "neuro_0A_blood_bri_a*"
      - "April4Blood_in_Fat_bri*"
      - "AprilDorsalRootsBloodParallel_*"
      - "newBloodAorta*"
      - "Thoracic_aorta"
      # The 8 "connection" bodies are the RADICULAR ARTERIES -- segmental
      # branches running from the aorta out to the nerve roots. Measured: every
      # one sits within 0.3 mm of an aorta body, and most bridge directly from
      # an aorta to a root, e.g. connection-7 is 0.026 mm from
      # newBloodAortaLonger-1 and 0.014 mm from AprilRootMainRootL-1.
      #
      # They were briefly classed as nerve_root on the strength of the name.
      # That was wrong, and it was not only a colour error: it put sigma at
      # 0.1432 instead of 0.66 S/m, a 4.6x difference in bodies that sit right
      # beside the electrodes. They are also the chain that
      # src/freecad/find_floating_bodies.py keeps reporting as an electrically
      # isolated island -- consistent with a vessel network that merely abuts
      # what it feeds.
      - "connection*"
    rho_ohm_m: 1.5152
    sigma_S_per_m: 0.66

  - name: dorsal_root_ganglion
    ed_material: "DRG"
    color_rgb: [218, 165,  32]
    patterns: ["*roots_football_in_middle*"]
    rho_ohm_m: 6.9832
    sigma_S_per_m: 0.1432
    note: "The DRG 'football' core. Its csf_coating/menging_coating shells match CSF/dura above."

  # ORDER MATTERS: meninges_dura is listed ABOVE nerve_root on purpose. The root
  # bundles are modelled in layers, and 12 files match both entries, e.g.
  #   "AprilRootBranchRootL-1 AprilDorsolBranchOutsidMengingL-1"
  # matches nerve_root (AprilRootBranchRoot*) and meninges_dura (*Menging*).
  # "OutsidMenging" means the outer meningeal sheath, so meninges_dura winning is
  # correct. Verify with `python3 check_tissue_map.py`, which reports every
  # ambiguous name.
  #
  # OPEN QUESTION for Mohamed: the roots come in Inside / Middle / OutsideMeninges
  # layers, mirroring the DRG's in_middle / csf_coating / menging_coating triple.
  # If that analogy holds, the "...Middle..." bodies are probably CSF, not nerve.
  # They are currently assigned Nerve Root. This changes the physics (CSF is
  # 1.7 S/m vs nerve 0.1432 S/m -- a 12x difference right next to the electrodes),
  # so it should be settled before any production sweep.
  - name: nerve_root
    ed_material: "Nerve Root"
    color_rgb: [255, 239, 179]
    patterns:
      - "AprilRootMainRoot*"
      - "AprilRootBranchRoot*"
      - "Assem1SmallRoot*"
      - "smallRoot*"
    rho_ohm_m: 6.9832
    sigma_S_per_m: 0.1432

  - name: sympathetic_chain
    ed_material: "Sympathetic Chain"
    color_rgb: [230, 168,  63]
    patterns: ["neuro_sympathetic_a-*", "neuro_sympathetic_c-*", "neuro_sympathetic_d-*", "neuro_sympathetic_ball-*"]
    rho_ohm_m: 6.9832
    sigma_S_per_m: 0.1432
    note: "Engineering Data has one 'Sympathetic Chain' material; the _ball bodies (ganglia) get it too."

  # Present in Engineering Data but with no body in this STL set (the thorax /
  # soft-tissue envelope isn't included in RADO's STL export):
  - name: soft_tissue
    ed_material: "Soft Tissue"
    color_rgb: [255, 205, 178]
    patterns: []
    rho_ohm_m: 250
    sigma_S_per_m: 0.004
    note: "Candidate outer boundary body if an envelope is added later (also the natural place to pin V=0)."

# Anything not matched above should be reported, not silently defaulted.
unmatched_policy: error
