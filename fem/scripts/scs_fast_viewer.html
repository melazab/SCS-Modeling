<!doctype html><meta charset="utf-8"><title>SCS biphasic potential</title>
<style>body{font:16px system-ui;margin:20px;background:#f4f6f8;color:#172432}button,input{margin:5px}canvas{background:white;border:1px solid #ccd2dc;max-width:100%}#surfaces label{display:inline-block;margin:5px}small{display:block;margin:8px 0}</style>
<h2 id="title"></h2><p>Idealized FAST-style symmetric biphasic stimulation · resistive FEM · potential, not neuronal activation</p>
<div><button id="play">Play</button><button id="first">First phase</button><button id="reverse">Reverse phase</button><button id="off">Between pulses</button><button id="save">Save annotated PNG</button></div>
<label>Time in cycle <input id="time" type="range" min="0" step="0.001" style="width:400px"></label>
<label>Playback slowdown <input id="slow" type="number" min="1" max="10000" value="1000">×</label>
<div id="status"></div><canvas id="wave" width="1000" height="105"></canvas>
<div id="surfaces"></div><small>Drag to rotate; wheel to zoom. Select surfaces to see internal tissues. The fixed color scale saturates at its displayed limits. Gap is an explicit modeling assumption.</small>
<canvas id="view" width="1000" height="750"></canvas><canvas id="legend" width="1000" height="60"></canvas>
<script>
/*SCS_DATA*/
const m=data.metadata,$=id=>document.getElementById(id),period=1000/m.frequency_hz,w=m.width_us/1000,g=m.gap_us/1000;
$('title').textContent=m.title; $('time').max=period-0.000001; $('time').value=0;
const canvas=$('view'),gpu=document.createElement('canvas');gpu.width=canvas.width;gpu.height=canvas.height;const gl=gpu.getContext('webgl',{preserveDrawingBuffer:true});
const output=canvas.getContext('2d'),pixels=new Uint8Array(canvas.width*canvas.height*4),frameImage=output.createImageData(canvas.width,canvas.height);
if(!gl){$('status').textContent='WebGL is unavailable in this browser. Enable hardware acceleration or use another browser.';throw Error('WebGL is required');}
function shader(type,src){let s=gl.createShader(type);gl.shaderSource(s,src);gl.compileShader(s);if(!gl.getShaderParameter(s,gl.COMPILE_STATUS))throw Error(gl.getShaderInfoLog(s));return s;}
let pr=gl.createProgram();gl.attachShader(pr,shader(gl.VERTEX_SHADER,`attribute vec3 pos;attribute float voltage;uniform vec3 center;uniform float size,zoom,ax,ay;varying float val;void main(){vec3 p=(pos-center)/size; p=vec3(cos(ay)*p.x+sin(ay)*p.z,p.y,-sin(ay)*p.x+cos(ay)*p.z);p=vec3(p.x,cos(ax)*p.y-sin(ax)*p.z,sin(ax)*p.y+cos(ax)*p.z);gl_Position=vec4(p.x*zoom*.75,p.y*zoom,p.z*.2,1.);val=voltage;}`));
gl.attachShader(pr,shader(gl.FRAGMENT_SHADER,`precision mediump float;varying float val;uniform float factor,clampV;void main(){float x=clamp(val*factor/clampV,-1.,1.);vec3 white=vec3(.95);vec3 col=mix(white,x>0.?vec3(.85,.1,.08):vec3(.08,.25,.85),abs(x));gl_FragColor=vec4(col,1.);}`));gl.linkProgram(pr);if(!gl.getProgramParameter(pr,gl.LINK_STATUS))throw Error(gl.getProgramInfoLog(pr));gl.useProgram(pr);
let lo=[Infinity,Infinity,Infinity],hi=[-Infinity,-Infinity,-Infinity];
for(const s of data.surfaces)for(const p of s.xyz)for(let k=0;k<3;k++){lo[k]=Math.min(lo[k],p[k]);hi[k]=Math.max(hi[k],p[k]);}
let center=lo.map((x,k)=>(x+hi[k])/2),size=Math.max(...hi.map((x,k)=>x-lo[k]))*.6;
const loc=n=>gl.getUniformLocation(pr,n);gl.uniform3fv(loc('center'),center);gl.uniform1f(loc('size'),size);gl.uniform1f(loc('clampV'),m.clamp_v);
for(const s of data.surfaces){s.pb=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,s.pb);gl.bufferData(gl.ARRAY_BUFFER,new Float32Array(s.xyz.flat()),gl.STATIC_DRAW);s.vb=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,s.vb);gl.bufferData(gl.ARRAY_BUFFER,new Float32Array(s.values),gl.STATIC_DRAW);let label=document.createElement('label'),check=document.createElement('input');check.type='checkbox';check.checked=!m.visible || m.visible.includes(s.name);s.check=check;check.onchange=draw;let pair=m.contact_map&&m.contact_map[s.name.replace('contact_','')];let labelText=s.name.startsWith('contact_')&&pair?`Lead ${pair[0]} / contact ${pair[1]}`:s.name;label.append(check,document.createTextNode(labelText));$('surfaces').append(label);}
let ax=-Math.PI/2,ay=0,zoom=1,t=0,playing=false,previous=0;
function phase(){if(t<w)return [1,'First phase'];if(t<w+g)return [0,'Interphase gap'];if(t<2*w+g)return [-1,'Reverse phase'];return [0,'Interpulse interval'];}
function draw(){let [factor,name]=phase();gl.viewport(0,0,canvas.width,canvas.height);gl.clearColor(1,1,1,1);gl.clear(gl.COLOR_BUFFER_BIT|gl.DEPTH_BUFFER_BIT);gl.enable(gl.DEPTH_TEST);for(const [key,val]of Object.entries({factor,ax,ay,zoom}))gl.uniform1f(loc(key),val);
for(const s of data.surfaces){if(!s.check.checked)continue;for(const [name,buf,n]of [['pos',s.pb,3],['voltage',s.vb,1]]){let a=gl.getAttribLocation(pr,name);gl.bindBuffer(gl.ARRAY_BUFFER,buf);gl.enableVertexAttribArray(a);gl.vertexAttribPointer(a,n,gl.FLOAT,false,0,0);}gl.drawArrays(gl.TRIANGLES,0,s.values.length);}
gl.readPixels(0,0,canvas.width,canvas.height,gl.RGBA,gl.UNSIGNED_BYTE,pixels);
for(let y=0;y<canvas.height;y++){let src=(canvas.height-1-y)*canvas.width*4;frameImage.data.set(pixels.subarray(src,src+canvas.width*4),y*canvas.width*4);}output.putImageData(frameImage,0,0);
$('status').textContent=`${name} · t=${t.toFixed(3)} ms / ${period.toFixed(3)} ms · ${m.frequency_hz} Hz · ${m.width_us} µs per phase · gap ${m.gap_us} µs (assumed) · total peak ${m.total_mA.toFixed(3)} mA · playback ${$('slow').value}× slower`;
let c=$('wave').getContext('2d');c.clearRect(0,0,1000,105);c.fillStyle='#172432';c.fillText('Current multiplier (first-phase montage × waveform)',15,15);c.strokeStyle='#184879';c.beginPath();for(const [x,y]of [[0,1],[w,1],[w,0],[w+g,0],[w+g,-1],[2*w+g,-1],[2*w+g,0],[period,0]]){c.lineTo(20+x/period*950,57-y*25);}c.stroke();c.strokeStyle='#d33';c.beginPath();c.moveTo(20+t/period*950,23);c.lineTo(20+t/period*950,90);c.stroke();c.fillText('0 ms',20,102);c.fillText(period.toFixed(3)+' ms',905,102);}
function setTime(v){playing=false;$('play').textContent='Play';t=v;$('time').value=t;draw();}
$('time').oninput=()=>setTime(Number($('time').value));$('first').onclick=()=>setTime(w/2);$('reverse').onclick=()=>setTime(w+g+w/2);$('off').onclick=()=>setTime((2*w+g+period)/2);$('play').onclick=()=>{playing=!playing;$('play').textContent=playing?'Pause':'Play';};
let dragging=false,last;canvas.onpointerdown=e=>{dragging=true;last=[e.clientX,e.clientY];canvas.setPointerCapture(e.pointerId);};canvas.onpointerup=()=>dragging=false;canvas.onpointermove=e=>{if(!dragging)return;ay+=(e.clientX-last[0])*.01;ax+=(e.clientY-last[1])*.01;last=[e.clientX,e.clientY];draw();};canvas.onwheel=e=>{e.preventDefault();zoom=Math.max(.1,Math.min(10,zoom*Math.exp(-e.deltaY*.001)));draw();};
let lc=$('legend').getContext('2d'),grad=lc.createLinearGradient(100,0,900,0);grad.addColorStop(0,'rgb(20,64,217)');grad.addColorStop(.5,'rgb(242,242,242)');grad.addColorStop(1,'rgb(217,26,20)');lc.fillStyle=grad;lc.fillRect(100,5,800,20);lc.fillStyle='#172432';lc.font='16px system-ui';lc.fillText('-'+m.clamp_v.toPrecision(4)+' V',100,48);lc.fillText('0 V',485,48);lc.fillText('+'+m.clamp_v.toPrecision(4)+' V',800,48);
$('save').onclick=()=>{draw();let out=document.createElement('canvas');out.width=1000;out.height=1030;let c=out.getContext('2d');c.fillStyle='white';c.fillRect(0,0,1000,1030);c.fillStyle='#172432';c.font='18px system-ui';c.fillText(m.title,20,28);c.font='13px system-ui';c.fillText($('status').textContent,20,53);c.fillText('Idealized resistive FEM potential. Color limits fixed; no neuronal activation predicted.',20,75);c.drawImage($('wave'),0,90);c.drawImage(canvas,0,195);c.drawImage($('legend'),0,950);let a=document.createElement('a');a.download='SCS_'+phase()[1].replaceAll(' ','_')+'.png';a.href=out.toDataURL();a.click();};
let initialFrames=0;function frame(now){if(initialFrames++<3)draw();if(playing){let slowdown=Math.max(1,Number($('slow').value)||1000);t=(t+(now-previous)/slowdown)%period;$('time').value=t;draw();}previous=now;requestAnimationFrame(frame);}draw();requestAnimationFrame(frame);
</script>
